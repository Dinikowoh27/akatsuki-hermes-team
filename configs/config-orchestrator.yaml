# ============================================================
# Orchestrator Profile Config — @SLEVENSYAIBOT
# ============================================================
# Letakkan file ini di: ~/.hermes/profiles/<ORCHESTRATOR_NAME>/config.yaml
# Ganti <ORCHESTRATOR_NAME> dengan nama profil bot utama (contoh: slevensyai)

model:
  default: claude-sonnet-4
  provider: openrouter
  api_key: ${OPENROUTER_API_KEY}

agent:
  max_turns: 90
  reasoning_effort: medium

toolsets:
  - hermes-cli
  - terminal
  - file
  - kanban
  - delegation

notification_sources: '*'

kanban:
  # MUST sama dengan nama profil ini sendiri
  orchestrator_profile: <ORCHESTRATOR_NAME>
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  auto_decompose: true
  auto_decompose_per_tick: 3
  failure_limit: 2
  max_in_progress_per_profile: null

telegram:
  reactions: false
  channel_prompts: {}
  allowed_chats: ''
  allowed_users:
    - <OWNER_USER_ID>
  extra:
    rich_messages: true
    # Topic yang boleh dibaca/dijawab oleh bot ini
    allowed_topics:
      - <ORCHESTRATOR_TOPIC_ID>   # Orchestrator HQ
      - <LOUNGE_TOPIC_ID>         # Lounge (opsional)

display:
  personality: technical
  compact: false

context:
  engine: compressor
